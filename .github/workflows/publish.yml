# self.chat publish — builds the client image on a push to the protected
# public-alpha branch, via the reusable GHCR workflow that lives in self.ai.
name: publish

on:
  push:
    branches: [public-alpha]

jobs:
  chat:
    uses: selfdothost/self.ai/.github/workflows/publish-ghcr.yml@public-alpha
    permissions:
      contents: read
      packages: write
    with:
      image: self.chat
      context: .
      dockerfile: Dockerfile
