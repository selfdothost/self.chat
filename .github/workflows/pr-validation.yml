# Validation for incoming pull requests. `pull_request` trigger runs fork PRs
# secret-less; pair with "require approval for first-time contributors".
name: pr-validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:types --if-present
      # ESLint flat config -- see .gitlab-ci.yml's lint:eslint job for detail.
      # selfshipyard/selfai/self.chat#9's 470-violation backlog is burned down
      # to 0 (!33/!35/!36/!37/!38/!39). Blocking again.
      - run: npm run lint:frontend --if-present
      - run: npm run test:frontend --if-present -- --run
      - run: npm run build
