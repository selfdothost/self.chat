# self.chat static SPA server.
# Serves the SvelteKit adapter-static build; unknown paths fall back to
# index.html so client-side routing works on deep links / refresh.
#
# API routes (/api, /ws, /ollama, /openai, ...) are NOT handled here — in
# the yard, traefik routes them to the self.ai API pod before they ever
# reach this container. Keep this server frontend-only.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted build assets.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve the requested file if it exists, else index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
