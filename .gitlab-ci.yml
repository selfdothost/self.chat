# self.chat CI — build the SvelteKit client image and publish to the yard's
# private registry.
#
# Nothing builds on the bastion; CI builds and publishes. buildkit-rootless
# (daemonless) NOT kaniko (gitlab-profile#60 / self.infrastructure#143): kaniko's
# writable layer always lands on the node's containerd root and can't be
# redirected; buildkit's state is a flag (`--root`) pointed at the /builds mount,
# and it runs rootless (uid 1000). Image lands at $CI_REGISTRY_IMAGE:<short-sha>;
# Flux's ImagePolicy promotes from there.
#
# Runner #28 is run_untagged=false → every job MUST carry a tag. Light jobs use
# `yard`; the frontend build runs on `yard-midbuild` (2x 8c/16Gi, floating) —
# 16Gi fits the vite 6GB+ heap (see Dockerfile NODE_OPTIONS) and keeps us off
# `bigbuild`, which is reserved for the heavy from-source builds (e.g. llamolotl).
#
# Two-job split (selfinfra/zlib reference): build:web is the MR gate (builds with
# NO --output = kaniko --no-push); publish:web builds + pushes on main only.

stages: [lint, test, build, e2e, publish]

include:
  - project: 'selfshipyard/selfai/self.ai'
    ref: main
    file: '.gitlab/ci-templates/sync-public-alpha.yml'

default:
  tags: [yard]

variables:
  BUILDKIT_IMAGE: "moby/buildkit:v0.31.2-rootless"   # pinned, not master
  # Bursty CI jobs: SMALL requests so a job schedules even on a busy node, HIGH
  # limits so it can burst when it actually runs. These jobs sit idle until
  # triggered, need real CPU/RAM only briefly, and don't all run at once — so
  # right-sizing the request (not the limit) is what lets k8s bin-pack them.
  # Requires the runner to permit resource overwrites (self.infrastructure#173).
  KUBERNETES_CPU_REQUEST: "250m"
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_MEMORY_REQUEST: "1Gi"
  KUBERNETES_MEMORY_LIMIT: "16Gi"

# Registry auth + buildkit state dir, both OUTSIDE the build context (a SIBLING
# of $CI_PROJECT_DIR): the CI_JOB_TOKEN credential must never sit where a
# `COPY . .` could bake it into the image (gitlab-profile#60 trap 3). --root
# points build bytes at the /builds mount, off the node containerd root (#143).
.buildkit-before: &buildkit-before
  - export BK_SCRATCH="${CI_BUILDS_DIR:-/builds}/.buildkit"
  - mkdir -p "$BK_SCRATCH" 2>/dev/null || export BK_SCRATCH="$(dirname "$CI_PROJECT_DIR")/.buildkit"
  - mkdir -p "$BK_SCRATCH/state" "$BK_SCRATCH/docker"
  - export DOCKER_CONFIG="$BK_SCRATCH/docker"
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_JOB_TOKEN" | base64 | tr -d '\n')\"}}}" > "$DOCKER_CONFIG/config.json"
  - chmod 600 "$DOCKER_CONFIG/config.json"
  - export BUILDKITD_FLAGS="--oci-worker-no-process-sandbox --root $BK_SCRATCH/state"

# --- publish: mirror main -> public-alpha (GitLab + GitHub), scheduled only -
sync:public-alpha:
  extends: .sync-public-alpha
  variables:
    MIRROR_EXCLUDE_PATHS: ""

# --- pipeline validation: guarantees a non-empty pipeline for every MR/push -
# Every other job here is gated behind a `changes:` filter, so a diff that
# touches none of those paths (CHANGELOG.md, docs/, README, ...) matches zero
# jobs. GitLab then refuses to create a pipeline at all ("the resulting
# pipeline would have been empty"), which permanently blocks merging under
# "pipelines must succeed" -- there's nothing for that check to point at.
# This job has no `changes:` filter, so it always runs.
pipeline:validate:
  stage: lint
  image: alpine:3.20
  tags: [yard]
  script:
    - echo "pipeline OK"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- lint: svelte-check type check. BLOCKING (no longer advisory) ------------
lint:
  stage: lint
  image: node:22-alpine3.20
  variables:
    # Skip Cypress's postinstall binary download -- this job never runs Cypress,
    # but plain `npm ci` installs it as a devDependency regardless, and its
    # binary fetch (download.cypress.io/cdn.cypress.io) has been an unreliable
    # single point of failure blocking lint/test entirely (self.chat CI incident,
    # 2026-08-03: 5+ retries needed purely from this, on a live prod-fix MR).
    CYPRESS_INSTALL_BINARY: "0"
    # Same story for onnxruntime-node's postinstall: it unconditionally tries to
    # fetch a GPU (CUDA) runtime .nupkg from api.nuget.org even though this job
    # never runs any ONNX/embedding code. "skip" is the documented value
    # (see onnxruntime-node/script/install-utils.js parseInstallFlag()) --
    # confirmed against the exact installed version (1.24.3) via unpkg.
    ONNXRUNTIME_NODE_INSTALL: "skip"
  before_script:
    - npm ci
  script:
    - npm run lint:types   # svelte-check — now gating; a type error fails the MR
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [src/**/*, package.json, package-lock.json, tsconfig.json, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/**/*, package.json, package-lock.json, tsconfig.json, .gitlab-ci.yml]

# eslint: flat config (eslint.config.js), ESLint 9+/typescript-eslint unified
# package, eslint-plugin-svelte 3. The rule-set expansion from that migration
# surfaced a fresh 470-violation backlog (selfshipyard/selfai/self.chat#9),
# burned down to 0 across !33/!35/!36/!37/!38/!39. Blocking again.
lint:eslint:
  stage: lint
  image: node:22-alpine3.20
  variables:
    # See lint job's comment: skips Cypress's and onnxruntime-node's unreliable
    # postinstall fetches, neither of which this job needs.
    CYPRESS_INSTALL_BINARY: "0"
    ONNXRUNTIME_NODE_INSTALL: "skip"
  before_script:
    - npm ci
  script:
    - npm run lint:frontend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [src/**/*, package.json, package-lock.json, eslint.config.js, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/**/*, package.json, package-lock.json, eslint.config.js, .gitlab-ci.yml]

# --- test: vitest unit tests -------------------------------------------------
test:unit:
  stage: test
  image: node:22-alpine3.20
  variables:
    # See lint job's comment: skips Cypress's and onnxruntime-node's unreliable
    # postinstall fetches, neither of which this job needs.
    CYPRESS_INSTALL_BINARY: "0"
    ONNXRUNTIME_NODE_INSTALL: "skip"
  before_script:
    - npm ci
  script:
    - npm run test:frontend -- --run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [src/**/*, package.json, package-lock.json, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/**/*, package.json, package-lock.json, .gitlab-ci.yml]

# --- build: static SvelteKit bundle -> nginx image — MR gate (build, NO push) -
# Heavy build (npm ci + vite build, 6GB heap). Runs when the app, deps, or the
# image recipe change — not on doc-only commits.
build:web:
  stage: build
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  tags: [yard-midbuild]
  timeout: 1h
  before_script: *buildkit-before
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt build-arg:APP_BUILD_HASH="$CI_COMMIT_SHORT_SHA"
      --import-cache "type=registry,ref=${CI_REGISTRY_IMAGE}/cache"
      --export-cache "type=registry,ref=${CI_REGISTRY_IMAGE}/cache,mode=max"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [src/**/*, static/**/*, package.json, package-lock.json, Dockerfile, nginx.conf, svelte.config.js, vite.config.ts, tailwind.config.js, postcss.config.js, scripts/**/*, .gitlab-ci.yml]

# --- publish: build + push :sha / :latest / :build-<pipeline-iid> (main only) -
# The :build-${CI_PIPELINE_IID} tag is prerequisite 1 of selfai/self.ai#148
# (activate the staged Flux image automation and end the two-MR deploy pattern).
# The ImagePolicy selects on
#   filterTags: { pattern: '^build-(?P<build>[0-9]+)$' }
#   policy:     { numerical: { order: asc } }
# IID is per-project and strictly increasing — exactly the ordering the policy
# assumes. The 'build-' PREFIX is not cosmetic: a bare-numeric tag cannot be
# distinguished from an all-digit short sha (chat has one live, 15212760,
# worth 15,212,760 to a numerical policy — it would beat every real IID for
# years and pin prod to an old commit). Forge runs the same shape
# (v<version>-<build>).
#
# Emitting the tag does NOT activate anything on its own: automation.yaml is
# still out of manifests/kustomization.yaml, and prerequisite 2 (a write-capable
# git token for ImageUpdateAutomation — flux/self-ai is read_repository only) is
# an admiral/mint exit per #148, not something CI can grant itself. Until both
# land, kustomization.yaml keeps hand-pinning and this tag is simply a third
# name for the same image.
publish:web:
  stage: publish
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  tags: [yard-midbuild]
  timeout: 1h
  before_script: *buildkit-before
  script:
    - export TAGS="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA},${CI_REGISTRY_IMAGE}:latest,${CI_REGISTRY_IMAGE}:build-${CI_PIPELINE_IID}"
    - 'export OUT="type=image,\"name=${TAGS}\",push=true"'
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --opt build-arg:APP_BUILD_HASH="$CI_COMMIT_SHORT_SHA"
      --import-cache "type=registry,ref=${CI_REGISTRY_IMAGE}/cache"
      --export-cache "type=registry,ref=${CI_REGISTRY_IMAGE}/cache,mode=max"
      --output "$OUT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/**/*, static/**/*, package.json, package-lock.json, Dockerfile, nginx.conf, svelte.config.js, vite.config.ts, tailwind.config.js, postcss.config.js, scripts/**/*, .gitlab-ci.yml]

# --- e2e: Cypress specs against a live self.ai API (sqlite, ephemeral) ------
# selfshipyard/selfai/self.chat#5 — the 4 specs under cypress/e2e/ need a real
# backend: registration.cy.ts registers the FIRST user and asserts they land
# as admin (Users.get_num_users() == 0 in self.ai's
# api/selfai_ui/routers/auths.py), which only holds against a genuinely empty
# user table. Decision: no MSW rewrite, no separate integration repo — stand
# self.ai's own API up right here, sqlite-backed (its zero-config default —
# api/selfai_ui/env.py's DATABASE_URL falls back to
# sqlite:///{DATA_DIR}/webui.db, and internal/db.py branches on "sqlite" in
# the URL for the engine's connect_args). No Postgres service, no DB service
# at all.
#
# Why a venv + git-archive fetch, not a `services:` container pulling self.ai's
# published api image: that image lives in a DIFFERENT project's container
# registry (container.home.../selfshipyard/selfai/self.ai/api), and whether
# this runner's services-image pull auth reaches across projects the way the
# job's own registry push does is NOT something readable from this repo — it
# depends on runner/executor config we have no visibility into. A plain HTTPS
# fetch of self.ai's api/ tree via GitLab's archive-by-path endpoint,
# authenticated with this job's own CI_JOB_TOKEN, sidesteps that: both
# projects have ci_job_token_scope_enabled: false (confirmed via the GitLab
# API), the same cross-project trust the `include:` above already leans on.
# Then `pip install` + `uvicorn selfai_ui.main:app` directly is the
# "lightweight way to run just the API" self.ai's own Dockerfile comments
# describe — api/ is torch-free, no CUDA, no model downloads (see
# api/requirements-api.txt).
#
# Same-origin, not CORS: self.chat's production build calls the API with
# relative URLs outside dev (WEBUI_BASE_URL='' — src/lib/constants.ts, and
# Dockerfile's own header comment says as much), and cypress.config.ts's
# baseUrl is hardcoded to http://localhost:8080. So this job builds
# self.chat's static bundle and points self.ai's API at it via
# FRONTEND_BUILD_DIR — exactly what self.ai/Dockerfile.combined does with two
# published images, just assembled live from source instead. One origin, one
# port, zero CORS_ALLOW_ORIGIN wiring.
#
# THE INFERENCE GAP IS CLOSED, by the mock upstream this job now runs.
# cypress/support/mock-openai.mjs is a dependency-free OpenAI-compatible server
# that self.ai's API talks to as an ordinary OpenAI connection, so chat.cy.ts
# exercises the real path: browser -> self.ai API -> upstream -> Socket.IO -> DOM.
#
# That path could NOT be reached by stubbing HTTP, which is why the chat tests
# sat skipped. `generateOpenAIChatCompletion` does `res.json()` and uses only
# `res.task_id`; the assistant reply arrives over Socket.IO from the API. A
# `cy.intercept` on POST /api/chat/completions removes the very request that
# makes the API emit those events, so no stub body can ever produce a reply.
# The earlier "the stub's stream shape is wrong" reading was a misdiagnosis --
# there is no stream reader on that path at all.
#
# ALL VERIFIED NOW (this block used to list them as unverified assumptions):
#   - cross-project CI_JOB_TOKEN read: works, via `git clone` (NOT the archive
#     REST endpoint, which job tokens cannot reach cross-project)
#   - requirements-api.txt installs on this image's system Python: yes, since
#     self.ai#60 moved the API tier to 3.13 and this image ships trixie/3.13.
#     Needs build-essential for numpy, which has no cp313 wheel (self.ai#108)
#   - egress to download.cypress.io: works
e2e:cypress:
  stage: e2e
  image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
  tags: [yard-midbuild]
  timeout: 45m
  # The Python wall is GONE. self.ai#60 landed (self.ai!335): the API tier moved
  # to 3.13, unstructured 0.15.9 -> 0.16.19, and pydub/audioop-lts were dropped
  # entirely (self.ai#106). So this image's own python3 (Debian trixie -> 3.13)
  # now matches what self.ai actually builds and runs, and step 2 installs
  # cleanly instead of failing resolution.
  #
  # allow_failure: FALSE -- the gate is live.
  #
  # Held at true until the suite proved itself, which it now has: TWO consecutive
  # green runs on main (35 tests, 31 passing, 0 failing, 4 pending). One green was
  # deliberately not enough -- an identical commit measured 19/12 and 20/11
  # earlier in this work, so the suite carried at least +/-1 run-to-run noise, and
  # flipping on a single sample would have blocked every MR in the repo on a flaky
  # gate.
  #
  # What made it stable: /api/models and the SSE completion are stubbed, the stub
  # models are registered as real workspace records (server-side preset validation
  # needs them), the sidebar is pinned open, the changelog is suppressed, and the
  # portalled menus are addressed by data-testid instead of text.
  #
  # The 4 pending are chat.cy.ts, each skipped INDIVIDUALLY with a checkable
  # reason in the file -- not a blanket describe.skip.
  #
  # If this starts failing intermittently, read cypress/videos + the selfai-api.log
  # artifact before reverting to allow_failure: it has been faster than the Cypress
  # output for every round-trip failure in this suite.
  allow_failure: false
  variables:
    NODE_OPTIONS: --max-old-space-size=6144
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"
    SELFAI_PROJECT_PATH: "selfshipyard/selfai/self.ai"
    SELFAI_REF: main
    SELFAI_API_DIR: "$CI_PROJECT_DIR/.selfai-api"
    HOST: "0.0.0.0"
    PORT: "8080"
    DATA_DIR: "$CI_PROJECT_DIR/.selfai-api-data"
    FRONTEND_BUILD_DIR: "$CI_PROJECT_DIR/build"
    ENABLE_OLLAMA_API: "False"
    # ON, pointed at the in-job mock upstream (step 3.5). This is what lets
    # chat.cy.ts test generation for real rather than simulating it.
    ENABLE_OPENAI_API: "True"
    MOCK_OPENAI_PORT: "8899"
    OPENAI_API_BASE_URLS: "http://127.0.0.1:8899/v1"
    # self.ai pairs keys to URLs positionally; the mock ignores the value but the
    # slot has to exist or the connection is treated as unconfigured.
    OPENAI_API_KEYS: "cypress-mock-key"
    # Enable the reference mod so mods-reference.cy.ts tests the REAL mod
    # surface rather than being carved out. Everything it needs already
    # ships in self.ai's tree: api/mods/reference/ carries mod.yaml (with
    # the `frontend` block, add_to_nav: true) and the built, content-hashed
    # entry bundle, and step 1 below already sparse-checkouts api/ -- so
    # this is a single env knob, not an install step. The spec grants
    # itself the `mods.reference.use` scope through the real admin
    # permissions round-trip, so no extra seeding is needed either.
    #
    # The spec's own header called for exactly this ("standing this spec up
    # for real needs those two knobs: reference-mod enablement + a self.ai
    # ref carrying those merges"). SELFAI_REF=main now carries them.
    ENABLED_MODS: "reference"
    SCARF_NO_ANALYTICS: "true"
    DO_NOT_TRACK: "true"
    ANONYMIZED_TELEMETRY: "false"
  before_script:
    # cypress/browsers ships node+chrome+ff+edge+Xvfb (debian:13-slim base)
    # but no Python, git, or curl — add just enough to run self.ai's API and
    # fetch its api/ tree below. python3-venv: Debian's system python is
    # externally-managed (PEP 668); a venv avoids --break-system-packages
    # entirely. git: step 1 below clones self.ai cross-project via job token
    # (see the note there for why it's git, not the repository-archive API).
    # curl: also used later to poll the API's own /health once it's up.
    # ffmpeg: self.ai's audio router now calls ffmpeg/ffprobe DIRECTLY rather
    # than through pydub (self.ai#106). NOTE this is NOT needed to import the
    # router -- utils/audio_ffmpeg.py only shells out at call time, which is
    # precisely the flaw pydub had (it imported the deleted stdlib audioop at
    # IMPORT time and took the whole router down). It is installed so the
    # environment under test matches the runtime image, where ffmpeg is now a
    # hard requirement, rather than passing here and failing in prod.
    # build-essential/gcc/python3-dev: NOT optional. unstructured==0.16.19 caps
    # numpy<2, and numpy 1.26.4 publishes wheels for cp39-cp312 ONLY -- no
    # cp313. On this image's 3.13 pip therefore has to build numpy from its
    # sdist, and without a toolchain that dies at metadata generation
    # ("error: metadata-generation-failed ... numpy"). self.ai's own test:api
    # and api/Dockerfile already apt-install exactly these three for the same
    # reason; this job was the odd one out. Costs a few minutes of numpy
    # compile per run. self.ai#108 tracks removing the source build entirely
    # by lifting the numpy<2 cap, which would make this unnecessary again.
    - apt-get update && apt-get install -y --no-install-recommends git curl python3 python3-venv python3-pip jq ca-certificates ffmpeg build-essential gcc python3-dev && rm -rf /var/lib/apt/lists/*
    - npm ci
  script:
    # 1. Fetch self.ai's api/ tree only via a sparse, blobless, shallow clone
    #    authenticated with this job's own CI_JOB_TOKEN. NOT GitLab's
    #    repository-archive REST endpoint (`repository/archive.tar.gz`) --
    #    that endpoint is not in the set CI/CD job tokens can reach
    #    cross-project (confirmed against a real 404 even with self.chat
    #    correctly added to self.ai's job-token allowlist); `git clone` IS a
    #    supported cross-project job-token operation, so it replaces the
    #    REST call entirely rather than working around the 404.
    - >
      git clone --depth 1 --branch "$SELFAI_REF" --filter=blob:none --sparse
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${SELFAI_PROJECT_PATH}.git"
      /tmp/selfai-clone
    - (cd /tmp/selfai-clone && git sparse-checkout set api)
    - mkdir -p "$SELFAI_API_DIR"
    - cp -r /tmp/selfai-clone/api/. "$SELFAI_API_DIR"/

    # 2. Install the API-tier deps into a venv.
    - python3 -m venv /tmp/selfai-venv
    - . /tmp/selfai-venv/bin/activate
    - pip install --no-cache-dir --upgrade pip
    - pip install --no-cache-dir -r "$SELFAI_API_DIR/requirements-api.txt"

    # 3. Build self.chat's static bundle (adapter-static -> ./build, SPA
    #    fallback to index.html per svelte.config.js) for self.ai's API to
    #    serve same-origin.
    - npm run build

    # 3.5 Start the mock OpenAI upstream BEFORE the API. self.ai queries an
    #     OpenAI connection's /models when it builds the model list, so an
    #     upstream that is not listening yet reads as a connection with no
    #     models rather than as an error worth retrying.
    - >
      (MOCK_OPENAI_PORT="$MOCK_OPENAI_PORT" exec node cypress/support/mock-openai.mjs)
      > "$CI_PROJECT_DIR/mock-openai.log" 2>&1 &
    - echo $! > /tmp/mock-openai.pid
    - >
      for i in $(seq 1 30); do
        if curl --silent --fail "http://127.0.0.1:${MOCK_OPENAI_PORT}/v1/models" > /dev/null 2>&1; then
          echo "mock upstream is up (after ${i}x1s polls)"; break;
        fi
        if [ "$i" -eq 30 ]; then
          echo "mock upstream did not start"; cat "$CI_PROJECT_DIR/mock-openai.log"; exit 1;
        fi
        sleep 1
      done

    # 4. Start self.ai's API in the background: fresh job-local DATA_DIR (so
    #    the sqlite DB is genuinely empty this run — required for
    #    registration.cy.ts's "first user becomes admin" assumption), built
    #    frontend wired in via FRONTEND_BUILD_DIR. WEBUI_SECRET_KEY is
    #    generated explicitly rather than via start.sh's /dev/random file
    #    dance — one less moving part in CI.
    - mkdir -p "$DATA_DIR"
    - export WEBUI_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
    - >
      (cd "$SELFAI_API_DIR" && exec uvicorn selfai_ui.main:app --host "$HOST" --port "$PORT" --forwarded-allow-ips '*')
      > "$CI_PROJECT_DIR/selfai-api.log" 2>&1 &
    - echo $! > /tmp/selfai-api.pid

    # 5. Wait for /health (same check as self.ai/api/Dockerfile's HEALTHCHECK).
    - >
      for i in $(seq 1 60); do
        if curl --silent --fail http://localhost:8080/health | jq -e '.status == true' > /dev/null 2>&1; then
          echo "self.ai API is up (after ${i}x2s polls)"; break;
        fi
        if [ "$i" -eq 60 ]; then
          echo "self.ai API did not become healthy in time"; cat "$CI_PROJECT_DIR/selfai-api.log"; exit 1;
        fi
        sleep 2
      done

    # 6. Run the specs headless. See the KNOWN GAP note above re: chat.cy.ts.
    - npm run cy:run
  after_script:
    - kill "$(cat /tmp/selfai-api.pid 2>/dev/null)" 2>/dev/null || true
    - kill "$(cat /tmp/mock-openai.pid 2>/dev/null)" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - cypress/videos/
      - cypress/screenshots/
      - selfai-api.log
      # The mock's log answers "did the API ever call the upstream, and with
      # which model id" in one line -- the two questions a failed chat spec
      # raises first.
      - mock-openai.log
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [src/**/*, static/**/*, cypress/**/*, package.json, package-lock.json, cypress.config.ts, svelte.config.js, vite.config.ts, tailwind.config.js, postcss.config.js, scripts/**/*, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [src/**/*, static/**/*, cypress/**/*, package.json, package-lock.json, cypress.config.ts, svelte.config.js, vite.config.ts, tailwind.config.js, postcss.config.js, scripts/**/*, .gitlab-ci.yml]